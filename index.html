<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルな家計簿</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>家計簿</h1>
  </header>

  <main>
    <section aria-labelledby="entry-heading">
      <h2 id="entry-heading">家計簿に登録</h2>
      <form id="entry-form">
        <p>
          <label for="entry-date">日付</label>
          <input type="date" id="entry-date" name="date" required>
        </p>
        <p>
          <label for="entry-item">品目</label>
          <input type="text" id="entry-item" name="item" required>
        </p>
        <p>
          <label for="entry-type">区分</label>
          <select id="entry-type" name="type" required>
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </p>
        <p>
          <label for="entry-amount">金額（円）</label>
          <input type="number" id="entry-amount" name="amount" min="0" step="1" required>
        </p>
        <button type="submit">追加</button>
      </form>
    </section>

    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">合計金額</h2>
      <p><output id="total-amount" aria-label="合計金額">0</output> 円</p>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">登録したデータ</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">日付</th>
            <th scope="col">品目</th>
            <th scope="col">区分</th>
            <th scope="col">金額（円）</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </section>
    <p id="app-status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
